<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bộ sưu tập thẻ bóng đá</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#e8ebef;--pocket:#f7f8fa;--edge:#c9ced6;--text:#141a24;--muted:#5d6675;--tag:#ffd23f;--tag-t:#1a1500;--field:#fff;
--disp:"Barlow Condensed","Arial Narrow",Impact,sans-serif;--body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1622;--pocket:#18222f;--edge:#2c3a4c;--text:#eef1f6;--muted:#97a3b5;--field:#18222f}}
:root[data-theme="dark"]{--bg:#0f1622;--pocket:#18222f;--edge:#2c3a4c;--text:#eef1f6;--muted:#97a3b5;--field:#18222f}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 var(--body)}
main{max-width:1120px;margin:0 auto;padding:32px 16px 56px}
h1{font:700 clamp(36px,7vw,60px)/1 var(--disp);margin:0 0 8px;letter-spacing:.01em}
#stat{color:var(--muted);margin:0 0 22px;max-width:60ch}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:22px}
input,select{font:inherit;color:var(--text);background:var(--field);border:1px solid var(--edge);border-radius:8px;padding:9px 12px}
.bar input{flex:1 1 200px}
:focus-visible{outline:3px solid var(--tag);outline-offset:2px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:16px}
.pocket{background:var(--pocket);border:1px solid var(--edge);border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:8px}
.pic{position:relative;display:block;width:100%;padding:0;border:0;background:none;cursor:zoom-in;border-radius:4px}
.pic img{display:block;width:100%;aspect-ratio:5/7;object-fit:cover;border-radius:4px;background:var(--edge)}
.price{position:absolute;right:-6px;bottom:10px;background:var(--tag);color:var(--tag-t);font:700 19px/1 var(--disp);padding:5px 9px 4px;border-radius:3px;transform:rotate(-2deg);box-shadow:0 1px 2px rgba(0,0,0,.35)}
.name{font-weight:500;font-size:15px;line-height:1.3;padding:0 2px 2px;overflow-wrap:anywhere}
.empty{grid-column:1/-1;color:var(--muted);padding:40px 0}
dialog{border:0;background:transparent;padding:8px;max-width:96vw}
dialog::backdrop{background:rgba(5,8,14,.8)}
dialog img{max-width:92vw;max-height:80vh;border-radius:8px;display:block;margin:auto}
dialog p{color:#fff;text-align:center;margin:10px 0 0;font:600 22px/1.2 var(--disp)}
</style>
</head>
<body>
<main>
  <h1>Bộ sưu tập thẻ bóng đá</h1>
  <p id="stat">Đang tải danh sách thẻ…</p>
  <div class="bar">
    <input type="search" id="q" placeholder="Tìm theo tên thẻ" aria-label="Tìm theo tên thẻ">
    <select id="sort" aria-label="Sắp xếp">
      <option value="orig">Thứ tự trong danh sách</option>
      <option value="asc">Giá thấp đến cao</option>
      <option value="desc">Giá cao đến thấp</option>
      <option value="name">Tên A đến Z</option>
    </select>
  </div>
  <div class="grid" id="grid"></div>
</main>
<dialog id="lb"><img alt=""><p></p></dialog>
<script>
const $=s=>document.querySelector(s);
let cards=[];
const fmt=(n,c)=>{c=c||'VND';try{return new Intl.NumberFormat(c==='USD'?'en-US':'vi-VN',{style:'currency',currency:c,maximumFractionDigits:c==='USD'?2:0}).format(n)}catch(e){return n+' '+c}};

function render(){
  const q=$('#q').value.trim().toLowerCase(),s=$('#sort').value;
  const list=cards.map((c,i)=>({...c,i})).filter(c=>(c.name||'').toLowerCase().includes(q));
  const by={orig:(a,b)=>a.i-b.i,asc:(a,b)=>a.price-b.price,desc:(a,b)=>b.price-a.price,name:(a,b)=>(a.name||'').localeCompare(b.name||'','vi')};
  list.sort(by[s]);
  const tot={};cards.forEach(c=>{const k=c.cur||'VND';tot[k]=(tot[k]||0)+(+c.price||0)});
  $('#stat').textContent=cards.length?cards.length+' thẻ. Tổng giá trị '+Object.entries(tot).map(([k,v])=>fmt(v,k)).join(' + ')+'.':'Chưa có thẻ nào trong danh sách.';
  const g=$('#grid');g.textContent='';
  if(!list.length){const e=document.createElement('div');e.className='empty';e.textContent=cards.length?'Không có thẻ nào khớp với từ khoá.':'Thêm thẻ vào file cards.json để chúng hiện ở đây.';g.append(e);return}
  for(const c of list){
    const src=encodeURI(c.img||'');
    const d=document.createElement('div');d.className='pocket';
    const b=document.createElement('button');b.className='pic';b.type='button';b.setAttribute('aria-label','Xem lớn: '+(c.name||'thẻ'));
    const im=document.createElement('img');im.loading='lazy';im.src=src;im.alt=c.name||'Thẻ bóng đá';
    const p=document.createElement('span');p.className='price';p.textContent=fmt(c.price,c.cur);
    b.append(im,p);
    b.onclick=()=>{$('#lb img').src=src;$('#lb img').alt=c.name||'';$('#lb p').textContent=(c.name||'')+'  '+fmt(c.price,c.cur);$('#lb').showModal()};
    const n=document.createElement('div');n.className='name';n.textContent=c.name||'(chưa đặt tên)';
    d.append(b,n);g.append(d);
  }
}
$('#lb').onclick=()=>$('#lb').close();
$('#q').oninput=render;$('#sort').onchange=render;
fetch('cards.json?v='+Date.now()).then(r=>{if(!r.ok)throw new Error(r.status);return r.json()})
  .then(d=>{cards=Array.isArray(d)?d:[];render()})
  .catch(()=>{$('#stat').textContent='Không đọc được file cards.json. Kiểm tra file có nằm cùng thư mục với index.html và viết đúng định dạng không.'});
</script>
</body>
</html>
