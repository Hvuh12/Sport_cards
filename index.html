<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HVCARDS | Personal Sports Card Collection</title>
<meta name="theme-color" content="#0B0B0D">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500&display=swap" rel="stylesheet">
<style>

:root {
  color-scheme: dark;
  --bg:#0b0b0d; --pocket:#161618; --edge:#2a2a2e;
  --text:#f5f5f5; --muted:#a0a0a5; --tag:#d4b67c;
  --tag-t:#0b0b0d; --field:#141416;
  --disp:"Barlow Condensed","Arial Narrow",Impact,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
}
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--text); font:16px/1.5 var(--body); }
main { max-width:1280px; margin:auto; padding:40px 24px 64px; }
.brand { font:700 clamp(48px,8vw,76px)/1 var(--disp); letter-spacing:-.025em; color:var(--tag); margin:0 0 4px; }
.brand span { color:var(--text); }
.brand-subtitle { color:var(--muted); font-size:11px; letter-spacing:.24em; margin:0 0 24px; }
.contact { display:flex; flex-wrap:wrap; align-items:center; gap:8px; margin:0 0 24px; color:var(--muted); font-size:14px; }
.contact a { color:var(--text); text-decoration:none; font-weight:500; background:var(--pocket); border:1px solid var(--edge); border-radius:6px; padding:8px 16px; }
.contact a:hover { color:var(--tag); border-color:var(--tag); background:#201d17; }
#stat { color:var(--muted); margin:0 0 16px; overflow-wrap:anywhere; }
.tabs { display:flex; gap:4px; margin:0 0 24px; border-bottom:1px solid var(--edge); overflow-x:auto; }
.tabs button { font:700 21px/1 var(--disp); color:var(--muted); background:none; border:0; border-bottom:3px solid transparent; padding:12px 18px; cursor:pointer; white-space:nowrap; }
.tabs button[aria-selected="true"] { color:var(--tag); border-bottom-color:var(--tag); }
.bar { display:flex; flex-wrap:wrap; gap:10px; margin-bottom:28px; }
input,select { font:inherit; color:var(--text); background:var(--field); border:1px solid var(--edge); border-radius:8px; padding:9px 12px; min-height:46px; }
.chip { font:700 18px/1 var(--disp); letter-spacing:.04em; color:var(--text); background:var(--field); border:1px solid var(--edge); border-radius:8px; padding:0 16px; min-height:46px; cursor:pointer; }
.chip[aria-pressed="true"] { background:var(--tag); color:var(--tag-t); border-color:var(--tag); }
.chip:hover,select:hover { border-color:#8a754f; }
:focus-visible { outline:2px solid var(--tag); outline-offset:3px; }
.search-box { position:relative; display:flex; align-items:center; flex:1 1 280px; min-width:0; background:var(--field); border:1px solid var(--edge); border-radius:8px; }
.search-box:focus-within { border-color:var(--tag); box-shadow:0 0 0 3px #d4b67c18; }
.search-icon { position:absolute; left:14px; color:var(--tag); pointer-events:none; }
.search-box input { width:100%; min-width:0; padding:12px 40px 12px 44px; background:transparent; border:0; outline:none; }
.search-box input::placeholder { color:var(--muted); }
.search-box input::-webkit-search-cancel-button { display:none; }
#clearSearch { position:absolute; right:7px; width:32px; height:32px; border:0; border-radius:5px; background:transparent; color:var(--muted); font-size:24px; line-height:1; cursor:pointer; }
#clearSearch:hover { background:var(--edge); color:var(--tag); }
#clearSearch[hidden] { display:none; }
.grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(175px,1fr)); gap:20px; }
.pocket { min-width:0; background:var(--pocket); border:1px solid var(--edge); border-radius:10px; padding:10px; display:flex; flex-direction:column; gap:12px; transition:transform .25s,border-color .25s,box-shadow .25s; }
@media (hover:hover) { .pocket:hover { transform:translateY(-4px); border-color:#8a754f; box-shadow:0 12px 28px #0006; } }
.pic { position:relative; display:block; width:100%; aspect-ratio:5/7; padding:0; border:0; background:#000; cursor:zoom-in; border-radius:5px; overflow:hidden; }
.pic img { display:block; width:100%; height:100%; object-fit:contain; object-position:center; }
.price { align-self:flex-end; max-width:100%; overflow-wrap:anywhere; background:var(--tag); color:var(--tag-t); font:700 18px/1 var(--disp); padding:6px 10px; border-radius:4px; }
.price.tx,.lbprice.tx { background:#252830; color:#d1d5db; }
.pocket.sold .price { background:#29292d; color:#aaa; }
.pocket.sold .pic img { opacity:.45; filter:grayscale(1); }
.name { font-weight:500; font-size:14px; line-height:1.5; padding:0 3px 4px; overflow-wrap:anywhere; }
.empty { grid-column:1/-1; color:var(--muted); padding:40px 16px; text-align:center; border:1px dashed var(--edge); border-radius:10px; }
dialog { border:0; background:transparent; padding:0; max-width:96vw; max-height:94vh; overflow:visible; }
dialog::backdrop { background:#000d; backdrop-filter:blur(6px); }
#lbc { position:relative; background:var(--field); color:var(--text); border:1px solid #343438; border-radius:14px; padding:44px 20px 20px; max-height:92vh; overflow:auto; box-shadow:0 24px 80px #0009; }
#lbx { position:absolute; top:4px; right:6px; border:0; background:none; font:400 30px/1 var(--body); color:var(--muted); cursor:pointer; padding:4px 10px; }
#lbx:hover { color:var(--tag); }
.lbimgs { display:flex; flex-wrap:wrap; gap:16px; justify-content:center; }
.lbimgs figure { margin:0; text-align:center; }
.lbimgs img { display:block; width:auto; height:auto; max-width:min(40vw,380px); max-height:65vh; object-fit:contain; background:#000; border-radius:6px; }
.lbimgs figcaption { color:var(--muted); font-size:14px; margin-top:6px; }
.lbinfo { text-align:center; margin-top:16px; }
.lbinfo h2 { font:700 30px/1.1 var(--disp); margin:0 0 10px; }
.lbinfo p { margin:8px 0 0; color:var(--muted); }
.lbprice { display:inline-block; background:var(--tag); color:var(--tag-t); font:700 22px/1 var(--disp); padding:6px 10px; border-radius:5px; }
@media(max-width:600px) {
  main { padding:28px 12px 40px; }
  .brand { font-size:52px; }
  .brand-subtitle { font-size:9px; letter-spacing:.18em; }
  .grid { grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; }
  .pocket { padding:6px; gap:8px; }
  .name { font-size:13px; }
  .price { font-size:16px; }
  .search-box { flex-basis:100%; }
  .bar select { width:100%; }
  .chip { flex:1; padding:0 8px; font-size:16px; }
  .lbimgs img { max-width:80vw; max-height:70vh; }
}
@media(prefers-reduced-motion:reduce) { *,*::before,*::after { transition:none!important; animation:none!important; } }
/* Card Detail V2 */
#lb { width:min(940px,96vw); margin:auto; }
#lbc { padding:22px; max-height:92dvh; }
.detail-header { display:flex; align-items:center; justify-content:space-between; gap:16px; padding-bottom:14px; margin-bottom:20px; border-bottom:1px solid var(--edge); }
.detail-mark { font:700 23px/1 var(--disp); color:var(--tag); letter-spacing:.04em; }
.detail-mark span { color:var(--text); }
#lbx { position:static; width:40px; height:40px; border:1px solid var(--edge); border-radius:8px; }
.detail-layout { display:grid; grid-template-columns:minmax(0,1.05fr) minmax(0,1fr); gap:28px; align-items:start; }
.detail-media,.detail-info { min-width:0; }
.detail-stage { display:grid; place-items:center; background:#000; border:1px solid var(--edge); border-radius:10px; min-height:240px; height:clamp(240px,53vh,490px); overflow:hidden; }
.detail-stage img { display:block; width:100%; height:100%; min-height:0; object-fit:contain; }
.detail-views { display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; }
.detail-views button,.detail-action { font:500 14px/1.3 var(--body); background:var(--pocket); color:var(--text); border:1px solid var(--edge); border-radius:7px; padding:10px 12px; cursor:pointer; text-decoration:none; }
.detail-views button[aria-pressed=true] { border-color:var(--tag); color:var(--tag); background:#d4b67c12; }
.detail-caption,.detail-note { font-size:13px; color:var(--muted); margin:10px 0; }
.detail-kicker { color:var(--tag); font-size:12px; text-transform:uppercase; letter-spacing:.12em; }
.detail-info h2 { font:700 clamp(27px,4vw,42px)/1.08 var(--disp); margin:8px 0 14px; overflow-wrap:anywhere; }
.detail-status { display:inline-block; font:700 15px/1 var(--disp); letter-spacing:.08em; border:1px solid var(--edge); border-radius:5px; padding:7px 9px; color:var(--muted); }
.detail-status.sale { color:#a5d6b4; border-color:#365743; }
.detail-price { font:700 35px/1.1 var(--disp); color:var(--tag); margin:12px 0; }
.detail-specs { margin:18px 0; border-top:1px solid var(--edge); }
.detail-specs div { display:grid; grid-template-columns:105px minmax(0,1fr); gap:10px; padding:10px 0; border-bottom:1px solid var(--edge); }
.detail-specs dt { color:var(--muted); font-size:13px; }
.detail-specs dd { margin:0; overflow-wrap:anywhere; white-space:pre-wrap; }
.detail-actions { display:flex; flex-wrap:wrap; gap:8px; margin-top:18px; }
.detail-action { flex:1 1 130px; text-align:center; }
.detail-action.primary { background:var(--tag); color:var(--tag-t); border-color:var(--tag); font-weight:700; }
.detail-action:hover,.detail-views button:hover { border-color:var(--tag); }
.detail-note { border-top:1px solid var(--edge); padding-top:12px; line-height:1.5; }
@media(max-width:650px) { #lbc { padding:14px; } .detail-layout { grid-template-columns:minmax(0,1fr); gap:18px; } .detail-stage { height:clamp(220px,48dvh,420px); } .detail-header { margin-bottom:12px; } }

/* V1.3.1: Best Offer and sharing */
.price-wrap { display:flex; flex-direction:column; align-items:flex-end; gap:4px; min-width:0; }
.offer-label { font-size:12px; color:var(--muted); line-height:1.2; }
.detail-price .offer-label { display:block; margin-top:5px; font:500 14px/1.3 var(--body); color:var(--muted); }
.detail-copy-status { font-size:13px; color:var(--muted); overflow-wrap:anywhere; }
.detail-copy-status:empty { display:none; }
.detail-share-fallback { width:100%; min-height:90px; margin-top:8px; color:var(--text); background:var(--bg); border:1px solid var(--edge); border-radius:6px; padding:8px; font:inherit; }
</style>
</head>
<body>
<main>
  <h1 class="brand">HV<span>CARDS</span></h1>
<p class="brand-subtitle">PERSONAL SPORTS CARD COLLECTION</p>
  <p class="contact">AE muốn mua hoặc offer trao đổi thì nhắn mình qua
    <a href="https://www.facebook.com/chosancut0610/" target="_blank" rel="noopener">Facebook</a>
    <a href="https://www.instagram.com/ha_vuu0610/" target="_blank" rel="noopener">Instagram</a>
  </p>
  <p id="stat" aria-live="polite">
    Đang tải danh sách thẻ…
</p>
  <div class="tabs" id="tabs" role="tablist"></div>
  <div class="bar">
     <div class="search-box">     <svg class="search-icon"          width="20" height="20"          viewBox="0 0 24 24"          fill="none"          stroke="currentColor"          stroke-width="1.8"          stroke-linecap="round"          aria-hidden="true">         <circle cx="11" cy="11" r="7"/>         <path d="m16 16 4 4"/>     </svg>      <input         type="search"         id="q"         placeholder="Tìm cầu thủ, hãng, Auto..."         aria-label="Tìm kiếm card"         autocomplete="off"     >      <button         type="button"         id="clearSearch"         aria-label="Xóa tìm kiếm"         title="Xóa tìm kiếm"         hidden     >×</button> </div>
    <button type="button" class="chip" data-s="sale" title="Còn hàng" aria-pressed="false">FOR SALE</button>
    <button type="button" class="chip" data-s="nfs" title="Not For Sale" aria-pressed="false">NFS</button>
    <button type="button" class="chip" data-s="sold" title="Đã bán" aria-pressed="false">SOLD</button>
    <select id="sort" aria-label="Sắp xếp">
      <option value="orig">Thứ tự trong danh sách</option>
      <option value="asc">Giá thấp đến cao</option>
      <option value="desc">Giá cao đến thấp</option>
      <option value="name">Tên A đến Z</option>
    </select>
  </div>
  <div class="grid" id="grid"></div>
</main>
<dialog id="lb" aria-label="Chi tiết card"><div id="lbc"></div></dialog>
<script>
const $=s=>document.querySelector(s);
let cards=[];
let loadError=false, loaded=false;
const fmt=(n,c)=>{c=c||'VND';try{return new Intl.NumberFormat(c==='USD'?'en-US':'vi-VN',{style:'currency',currency:c,maximumFractionDigits:c==='USD'?2:0}).format(n)}catch(e){return n+' '+c}};

const pn=c=>{const v=c.price;return typeof v==='number'?v:(/^\d+(\.\d+)?$/.test(String(v).trim())?+v:NaN)};
const plabel=c=>isNaN(pn(c))?(String(c.price??'').trim().toUpperCase()||'—'):fmt(pn(c),c.cur);
const cmp=d=>(a,b)=>{const x=pn(a),y=pn(b);return isNaN(x)?(isNaN(y)?0:1):isNaN(y)?-1:d*(x-y)};
const ALWAYS=['Football','F1'];
const ALIAS={'bóng đá':'Football','bong da':'Football','soccer':'Football'};
const st=c=>{const t=String(c.price??'').trim().toLowerCase();return /^sold/.test(t)?'sold':/^(nfs|nft|not for sale)/.test(t)?'nfs':!isNaN(pn(c))?'sale':''};
const SL={sale:'FOR SALE',nfs:'NFS',sold:'SOLD'};
const sp=c=>{const x=(c.sport||'').trim();return ALIAS[x.toLowerCase()]||x};
let tab='all',status='',labels={};
const BEST_OFFER = 'or Best Offer';
// An explicit id is preferred. Existing cards get an ID derived from their image path.
// It is independent of price, status, and list order.
function cardKey(c){
  const id=String(c.id??'').trim();
  if(id)return id;
  const source=String(c.img||c.back||c.actual||[c.name,c.brand,c.season,c.serial,c.info].join('|')).trim();
  // Encode the entire key rather than relying on a short hash that can collide.
  const bytes=new TextEncoder().encode(source);
  const encoded=btoa(Array.from(bytes,b=>String.fromCharCode(b)).join('')).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
  return 'auto-'+encoded;
}
function cardUrl(c){
  const url=new URL(location.href);
  url.search='';url.hash='';
  url.searchParams.set('card',cardKey(c));
  return url.href;
}
function updateCardUrl(c){
  const url=new URL(location.href);
  if(c)url.searchParams.set('card',cardKey(c));else url.searchParams.delete('card');
  try{history.replaceState(history.state,'',url);}catch{}
}
function openLinkedCard(){
  const key=new URL(location.href).searchParams.get('card');
  if(!key)return;
  const matches=cards.filter(c=>cardKey(c)===key);
  if(matches.length===1)openLb(matches[0]);
  else {$('#stat').textContent=matches.length?'Link card chưa xác định duy nhất. Vui lòng tìm card trong bộ sưu tập.':'Card này không còn trong bộ sưu tập hoặc đường dẫn không còn hợp lệ.';updateCardUrl(null);}
}
function drawTabs(){
  const m=new Map();ALWAYS.forEach(x=>m.set(x.toLowerCase(),x));
  cards.forEach(c=>{const x=sp(c);if(x&&!m.has(x.toLowerCase()))m.set(x.toLowerCase(),x)});
  labels={};const box=$('#tabs');box.textContent='';
  const mk=(key,label,tip)=>{if(key!=='all')labels[key]=label;const b=document.createElement('button');b.type='button';b.setAttribute('role','tab');b.setAttribute('aria-selected',String(tab===key));b.textContent=label;if(tip)b.title=tip;b.onclick=()=>{tab=key;render()};box.append(b)};
  mk('all','ALL');m.forEach((label,key)=>mk(key,label));
}
  
const normalizeSearch = value =>
    String(value ?? '')
        .toLowerCase()
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '')
        .replace(/đ/g, 'd')
        .trim();

function matchesSearch(card, query) {
    const keywords = normalizeSearch(query)
        .split(/\s+/)
        .filter(Boolean);

    const searchable = normalizeSearch([
        card.name,
        card.brand,
        card.season,
        card.info,
        card.sport,
        sp(card),
        sp(card).toLowerCase() === 'football' ? 'bóng đá soccer' : '',
        sp(card).toLowerCase() === 'f1' ? 'Formula 1' : '',
        SL[st(card)],
        card.price
    ].filter(v => v != null).join(' '));

    return keywords.every(
        keyword => searchable.includes(keyword)
    );
}

function render(){
  drawTabs();
  document.querySelectorAll('.chip').forEach(b=>b.setAttribute('aria-pressed',String(status===b.dataset.s)));
  const q=$('#q').value.trim(),s=$('#sort').value;
  $('#clearSearch').hidden = !$('#q').value;
  if(!loaded){ $('#stat').textContent=loadError?'Không đọc được file cards.json.':'Đang tải danh sách thẻ…'; return; }
  const base=cards.map((c,i)=>({...c,i})).filter(c=>(tab==='all'||sp(c).toLowerCase()===tab)&&(!status||st(c)===status));
  const list = base.filter(c => matchesSearch(c, q));
  const by={orig:(a,b)=>a.i-b.i,asc:cmp(1),desc:cmp(-1),name:(a,b)=>(a.name||'').localeCompare(b.name||'','vi')};
  list.sort(by[s]);
  const lab=[tab==='all'?'':labels[tab],SL[status]].filter(Boolean).map(x=>' '+x).join('');
  $('#stat').textContent = `Hiển thị ${list.length}/${base.length} thẻ${lab}` + (q ? ` · "${q}"` : '');
  const g=$('#grid');g.textContent='';
  if(!list.length){const e=document.createElement('div');e.className='empty';e.textContent=base.length?'Không có thẻ nào khớp với từ khoá.':(status?'Chưa có thẻ nào ở mục này.':tab==='all'?'Thêm thẻ vào file cards.json để chúng hiện ở đây.':'Thêm “sport”: “'+labels[tab]+'” vào các thẻ thuộc mục này trong cards.json.');g.append(e);return}
  for(const c of list){
    const src=encodeURI(c.img||'');
    const d=document.createElement('div');d.className='pocket'+(st(c)==='sold'?' sold':'');
    const b=document.createElement('button');b.className='pic';b.type='button';b.setAttribute('aria-label','Xem lớn: '+(c.name||'thẻ'));
    const im=document.createElement('img');im.loading='lazy';im.src=src;im.alt=c.name||'Thẻ bóng đá';
    const p=document.createElement('span');p.className='price'+(isNaN(pn(c))?' tx':'');p.textContent=plabel(c);
    b.append(im);
    b.onclick=()=>openLb(c);
    const n=document.createElement('div');n.className='name';n.textContent=c.name||'(chưa đặt tên)';
    const priceWrap=document.createElement('div');priceWrap.className='price-wrap';priceWrap.append(p);
    if(st(c)==='sale'){const offer=document.createElement('span');offer.className='offer-label';offer.textContent=BEST_OFFER;priceWrap.append(offer)}
    d.append(b,priceWrap,n);g.append(d);
  }
}
function openLb(c){
  const box=$('#lbc'); box.replaceChildren();
  const make=(tag,cls,text)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e};
  const header=make('div','detail-header');
  const mark=make('div','detail-mark','HV');mark.append(make('span','','CARDS'));
  const x=make('button','','×');x.type='button';x.id='lbx';x.setAttribute('aria-label','Đóng chi tiết card');
  header.append(mark,x);
  const layout=make('div','detail-layout'),media=make('div','detail-media'),info=make('div','detail-info');
  const stage=make('div','detail-stage'),views=make('div','detail-views'),caption=make('p','detail-caption');
  caption.setAttribute('aria-live','polite');
  const im=make('img'); stage.append(im);
  const photos=[
    {src:c.img,label:'Front',description:'Mặt trước · Ảnh gallery'},
    {src:c.back,label:'Back',description:'Mặt sau · Ảnh gallery'},
    {src:c.actual,label:'Actual front',description:'Mặt trước · Ảnh chụp thực tế'},
    {src:c.actualBack,label:'Actual back',description:'Mặt sau · Ảnh chụp thực tế'}
  ].filter(p=>typeof p.src==='string'&&p.src.trim());
  const buttons=[];
  function selectPhoto(i){
    const p=photos[i];if(!p)return;
    im.hidden=false;stage.replaceChildren(im);im.alt=(c.name||'Card')+' – '+p.label;im.src=encodeURI(p.src);
    caption.textContent=p.description;
    buttons.forEach((b,j)=>b.setAttribute('aria-pressed',String(i===j)));
  }
  im.onerror=()=>{im.hidden=true;stage.replaceChildren(make('p','detail-caption','Không tải được ảnh.'))};
  photos.forEach((p,i)=>{const b=make('button','',p.label);b.type='button';b.onclick=()=>selectPhoto(i);buttons.push(b);views.append(b)});
  if(photos.length)selectPhoto(0);else stage.replaceChildren(make('p','detail-caption','Chưa có ảnh card.'));
  media.append(stage,views,caption);
  const state=st(c);
  info.append(make('div','detail-kicker',sp(c)||'Sports card'));
  const title=make('h2','',c.name||'Untitled card');title.id='detail-title';info.append(title);
  info.append(make('span','detail-status '+state,SL[state]||'STATUS UNKNOWN'));
  if(state==='sale'){
    const price=make('div','detail-price',plabel(c));
    price.append(make('span','offer-label',BEST_OFFER));info.append(price);
  }
  const specs=make('dl','detail-specs');
  [['Hãng',c.brand],['Mùa thẻ',c.season],['Bộ thẻ',c.set],['Serial',c.serial],['Loại card',Array.isArray(c.type)?c.type.join(', '):c.type],['Grade',c.grade],['Thông tin',c.info]].forEach(([label,value])=>{
    if(value==null||String(value).trim()==='')return;
    const row=make('div');row.append(make('dt','',label),make('dd','',String(value)));specs.append(row);
  });
  if(specs.children.length)info.append(specs);
  const actions=make('div','detail-actions');
  function contact(label,url,primary){const a=make('a','detail-action'+(primary?' primary':''),label);a.href=url;a.target='_blank';a.rel='noopener noreferrer';actions.append(a)}
  if(state!=='sold'){
    contact(state==='sale'?'Contact to Buy / Trade':'Contact Collector','https://www.facebook.com/chosancut0610/',true);
    contact('Instagram','https://www.instagram.com/ha_vuu0610/',false);
  }
  const copyStatus=make('p','detail-copy-status');copyStatus.setAttribute('role','status');
  const fallback=make('textarea','detail-share-fallback');fallback.readOnly=true;fallback.hidden=true;fallback.setAttribute('aria-label','Nội dung để sao chép thủ công');
  async function copyText(text){
    fallback.hidden=true;copyStatus.textContent='';
    try{await navigator.clipboard.writeText(text);return true}catch{}
    fallback.value=text;fallback.hidden=false;fallback.focus();fallback.select();
    try{if(document.execCommand('copy')){fallback.hidden=true;return true}}catch{}
    copyStatus.textContent='Không sao chép tự động được. Hãy nhấn Ctrl+C hoặc dùng chức năng Copy trên điện thoại.';return false;
  }
  function copyButton(label,getText){
    const button=make('button','detail-action',label);button.type='button';
    button.onclick=async()=>{const ok=await copyText(getText());copyStatus.textContent=ok?'Copied!':copyStatus.textContent;if(ok){button.textContent='Copied!';setTimeout(()=>{button.textContent=label},1600)}};
    actions.append(button);
  }
  copyButton('Copy card details',()=>{
    const type=Array.isArray(c.type)?c.type.join(', '):c.type;
    const fields=[c.name,c.brand,c.season,c.set,c.serial,type,c.grade,c.info].map(v=>String(v??'').trim()).filter(Boolean);
    const priceLine=state==='sale'?'Price: '+plabel(c)+' '+BEST_OFFER:state?SL[state]:'';
    return [...new Set(fields),priceLine,'','HVCARDS',cardUrl(c)].filter((v,i,a)=>v||i===a.length-3).join('\n');
  });
  copyButton('Share card',()=>cardUrl(c));
  info.append(actions,copyStatus,fallback);
  const hasActual=photos.some(p=>p.label.startsWith('Actual'));
  info.append(make('p','detail-note','Ảnh gallery có thể được tăng nét hoặc cân bằng ánh sáng để trưng bày. '+(hasActual?'Vui lòng xem ảnh Actual để tham khảo tình trạng thực tế.':'Ảnh chụp thực tế có thể được cung cấp khi liên hệ.')+' Không dùng ảnh đã xử lý để xác định tình trạng card.'));
  layout.append(media,info);box.append(header,layout);
  $('#lb').setAttribute('aria-labelledby','detail-title');if(!$('#lb').open)$('#lb').showModal();box.scrollTop=0;updateCardUrl(c);
}
$('#lb').onclick=e=>{if(e.target===$('#lb')||e.target.id==='lbx')$('#lb').close()};
$('#lb').addEventListener('close',()=>updateCardUrl(null));
$('#q').oninput=render;
$('#sort').onchange=render;
function clearSearch(){
  $('#q').value='';
  render();
  $('#q').focus();
}
$('#clearSearch').addEventListener('click',clearSearch);
$('#q').addEventListener('keydown',e=>{
  if(e.key==='Escape' && $('#q').value){e.preventDefault();clearSearch();}
});
document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{status=status===b.dataset.s?'':b.dataset.s;render()});
fetch('cards.json', {cache:'no-cache'}).then(r=>{if(!r.ok)throw new Error(r.status);return r.json()})
  .then(d=>{if(!Array.isArray(d))throw new Error('Invalid cards.json');cards=d;loaded=true;render();openLinkedCard()})
  .catch(()=>{loadError=true;$('#stat').textContent='Không đọc được file cards.json. Kiểm tra file có nằm cùng thư mục với index.html và viết đúng định dạng không.'});
</script>
